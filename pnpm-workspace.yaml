packages:
  - apps/*
  - apps/inspector/*
  - packages/*

catalog:
  "@hono/node-server": 2.1.3
  "@modelcontextprotocol/sdk": 1.32.1
  "@types/better-sqlite3": ^9.6.0
  better-sqlite3: 13.0.3
  hono: ^4.13.13
  # Vitest 5 remains a separate migration from this pin set.
  typescript: 7.0.2
  vitest: 4.1.12
  # Patched constrained-collection validation; shared by runtime and tooling.
  zod: ^4.6.7

overrides:
  "@hono/node-server": 2.1.3
  # Match engines.node >=24; @types/node 26 tracks Node 26.
  "@types/node": 24.13.4
  # Keep native fetch dispatcher declarations aligned with engine-gateway's undici runtime.
  "@types/node>undici-types": 7.30.1
  # Optional ONNX extra only. onnxruntime-node declares adm-zip ^0.5.16; 0.6.1 is the advisory-clean line.
  adm-zip: 0.6.1
  body-parser: 2.4.0
  browserslist: 4.28.9
  fast-uri: 3.1.9
  form-data: 4.0.6
  hono: 4.13.13
  ip-address: 10.7.4
  nanoid: 3.3.19
  onnxruntime-web: "-"
  postcss: 8.5.31
  postcss-selector-parser: 7.1.6
  qs: 6.16.1
  # Inspector loopback SPA; v7 is a breaking upgrade. See scripts/ci/audit-exemptions.json.
  react-router: 6.30.6
  react-router-dom: 6.30.6
  # Optional ONNX extra only. transformers 4.2.0 declares sharp ^0.34.5; 0.35.5 fixes the bundled librsvg vulnerability.
  sharp: 0.35.5
  smol-toml: 1.9.1
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  ws: 8.21.3
  zod: 4.6.7

allowBuilds:
  # Supported targets load bundled prebuilds; implicit node-gyp fallback is not part of the install contract.
  better-sqlite3: false
  # CPU binaries ship in the package; the postinstall only fetches optional GPU execution providers.
  onnxruntime-node: false
