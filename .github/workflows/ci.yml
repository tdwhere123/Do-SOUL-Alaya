name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '12.3.4'

jobs:
  # Separate jobs per OS so a cancelled Windows shard cannot fail Quality on macOS.
  # The 60 minute cap stays; bench-runner and core-daemon no longer share one clock with the libraries.
  test-shard-ubuntu:
    name: Test ${{ matrix.group }}${{ matrix.shard_name && format(' {0}', matrix.shard_name) || '' }} (ubuntu-node24)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: libraries
          - group: core-daemon
          - group: bench-runner
            vitest_shard: "1/2"
            shard_name: "1-of-2"
          - group: bench-runner
            vitest_shard: "2/2"
            shard_name: "2-of-2"
    env:
      SHARD_LABEL: ubuntu-node24
      SHARD_COVERAGE: "1"
    steps: &shard-steps
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck also consumes the daemon's compiled Node entries from bench-runner.
      - name: Build
        run: pnpm build

      # The command checks the whole workspace; repeat it once per OS, not per shard.
      - name: Typecheck
        if: ${{ matrix.group == 'libraries' }}
        run: pnpm run --if-present typecheck

      - name: Test
        id: vitest
        shell: bash
        env:
          VITEST_SHARD: ${{ matrix.vitest_shard || '' }}
          # Reuse compiled code, never runtime state; V8 coverage needs uncached compilation.
          NODE_COMPILE_CACHE: ${{ env.SHARD_COVERAGE == '0' && matrix.group == 'bench-runner' && format('{0}/alaya-node-compile-cache', runner.temp) || '' }}
        run: |
          args=(--group="${{ matrix.group }}" --projects-file=shard-projects.json)
          if [[ -n "${VITEST_SHARD}" ]]; then
            args+=(--shard="${VITEST_SHARD}")
          fi
          # Node treats even an empty disable variable as disabling its compile cache.
          unset NODE_DISABLE_COMPILE_CACHE
          if [[ "${SHARD_COVERAGE}" == "1" ]]; then
            export NODE_DISABLE_COMPILE_CACHE=1
            args+=(--defer-coverage-thresholds --coverage.enabled --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=lcov)
          fi
          node scripts/ci/run-vitest-projects.mjs "${args[@]}"

      - name: Record shard manifest
        if: always()
        shell: bash
        env:
          VITEST_SHARD: ${{ matrix.vitest_shard || '' }}
        run: |
          args=(--group="${{ matrix.group }}" --label="${SHARD_LABEL}" --status="${{ steps.vitest.outcome }}" --output=shard-manifest.json --projects-file=shard-projects.json)
          if [[ -n "${VITEST_SHARD}" ]]; then
            args+=(--shard="${VITEST_SHARD}")
          fi
          node scripts/ci/write-shard-manifest.mjs "${args[@]}"

      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ env.SHARD_LABEL }}-${{ matrix.group }}${{ matrix.shard_name && format('-{0}', matrix.shard_name) || '' }}
          path: shard-manifest.json
          # Replace this shard on rerun; untouched successful shards remain available.
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload coverage
        if: ${{ env.SHARD_COVERAGE == '1' && steps.vitest.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ env.SHARD_LABEL }}-${{ matrix.group }}${{ matrix.shard_name && format('-{0}', matrix.shard_name) || '' }}
          path: coverage
          overwrite: true
          retention-days: 14
          if-no-files-found: error

  test-shard-macos:
    name: Test ${{ matrix.group }}${{ matrix.shard_name && format(' {0}', matrix.shard_name) || '' }} (macos-node24)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: libraries
          - group: core-daemon
          - group: bench-runner
            vitest_shard: "1/2"
            shard_name: "1-of-2"
          - group: bench-runner
            vitest_shard: "2/2"
            shard_name: "2-of-2"
    env:
      SHARD_LABEL: macos-node24
      SHARD_COVERAGE: "0"
    steps: *shard-steps

  test-shard-windows:
    name: Test ${{ matrix.group }}${{ matrix.shard_name && format(' {0}', matrix.shard_name) || '' }} (windows-node24)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: libraries
          - group: core-daemon
          # Separate cold daemon fixtures onto single-fork hosts.
          - group: bench-runner
            vitest_shard: "1/4"
            shard_name: "1-of-4"
          - group: bench-runner
            vitest_shard: "2/4"
            shard_name: "2-of-4"
          - group: bench-runner
            vitest_shard: "3/4"
            shard_name: "3-of-4"
          - group: bench-runner
            vitest_shard: "4/4"
            shard_name: "4-of-4"
    env:
      SHARD_LABEL: windows-node24
      SHARD_COVERAGE: "0"
    steps: *shard-steps

  # These guards consume the checkout, not test artifacts; report failures while shards run.
  hygiene-ubuntu:
    name: Hygiene (ubuntu-node24)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep for hygiene guards
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build
        run: pnpm build

      - name: Hygiene
        run: pnpm run hygiene:unused

      - name: Check CI shard contracts
        run: |
          node --test scripts/ci/test-shards.test.mjs
          node scripts/ci/write-shard-manifest.mjs --self-test
          node scripts/ci/check-shard-manifests.mjs --self-test

      - name: Guard production console
        run: pnpm run hygiene:no-console

      - name: Guard test as-any
        run: |
          pnpm run ci:test-as-any -- --self-test
          pnpm run ci:test-as-any

      - name: Guard storage row casts
        run: pnpm run hygiene:storage-row-casts

      - name: Guard production throw new Error
        run: |
          pnpm run ci:throw-new-error -- --self-test
          pnpm run ci:throw-new-error

      - name: Guard production as-unknown-as
        run: |
          pnpm run ci:production-unknown-as -- --self-test
          pnpm run ci:production-unknown-as

      - name: Guard env docs
        run: pnpm run ci:env-docs

      - name: Guard changelog version
        run: pnpm run ci:changelog-version

      - name: Guard process.env call sites
        run: pnpm run hygiene:process-env

      - name: Guard doc links
        run: pnpm run ci:doc-links

      - name: Guard unused package exports
        run: pnpm run hygiene:unused-exports

      - name: Installer script checks
        run: pnpm run ci:install-scripts

      - name: Dependency audit moderate severity
        run: |
          for attempt in 1 2 3; do
            pnpm run ci:audit && exit 0
            sleep 20
          done
          exit 1

      - name: Guard inspector dependency isolation
        run: pnpm run hygiene:inspector-deps

      - name: Guard repository structure
        run: pnpm run ci:repository-structure

  quality-ubuntu:
    name: Quality (ubuntu-node24)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test-shard-ubuntu, hygiene-ubuntu]
    if: always()
    env:
      SHARD_LABEL: ubuntu-node24
      SHARD_RESULT: ${{ needs.test-shard-ubuntu.result }}
      REQUIRE_HYGIENE: "1"
      HYGIENE_RESULT: ${{ needs.hygiene-ubuntu.result }}
      RUN_COVERAGE: "1"
      RUN_SMOKE: "0"
    steps: &quality-steps
      - name: Check hygiene result
        if: ${{ env.REQUIRE_HYGIENE == '1' }}
        shell: bash
        run: |
          if [[ "${HYGIENE_RESULT}" != "success" ]]; then
            echo "Hygiene finished as ${HYGIENE_RESULT}"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download shard manifests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: shard-${{ env.SHARD_LABEL }}-*
          path: shard-manifests
          merge-multiple: false

      - name: Download coverage
        if: ${{ env.RUN_COVERAGE == '1' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-${{ env.SHARD_LABEL }}-*
          path: shard-coverage
          merge-multiple: false

      - uses: pnpm/action-setup@v6
        if: ${{ env.RUN_SMOKE == '1' || env.RUN_COVERAGE == '1' }}
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        if: ${{ env.RUN_SMOKE == '1' || env.RUN_COVERAGE == '1' }}
        run: pnpm install --frozen-lockfile

      - name: Check shard manifests and coverage
        shell: bash
        run: |
          args=(--label="${SHARD_LABEL}" --shards=shard-manifests --needs-result="${SHARD_RESULT}")
          if [[ "${RUN_COVERAGE}" == "1" ]]; then
            args+=(--coverage=shard-coverage)
          fi
          node scripts/ci/check-shard-manifests.mjs "${args[@]}"

      - name: Build
        if: ${{ env.RUN_SMOKE == '1' }}
        run: pnpm build

      - name: CLI preflight smoke
        if: ${{ env.RUN_SMOKE == '1' }}
        run: node scripts/ci/smoke-built-cli.mjs --preflight-only

  quality-macos:
    name: Quality (macos-node24)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [test-shard-macos]
    if: always()
    env:
      SHARD_LABEL: macos-node24
      SHARD_RESULT: ${{ needs.test-shard-macos.result }}
      REQUIRE_HYGIENE: "0"
      RUN_COVERAGE: "0"
      RUN_SMOKE: "0"
    steps: *quality-steps

  quality-windows:
    name: Quality (windows-node24)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [test-shard-windows]
    if: always()
    env:
      SHARD_LABEL: windows-node24
      SHARD_RESULT: ${{ needs.test-shard-windows.result }}
      REQUIRE_HYGIENE: "0"
      RUN_COVERAGE: "0"
      RUN_SMOKE: "1"
    steps: *quality-steps

  content-contracts:
    name: Bench content contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check bench-history contract
        run: |
          node --test scripts/ci/check-content-contracts.test.mjs
          node --test scripts/ci/check-benchmark-storage.test.mjs
          node scripts/ci/check-content-contracts.mjs

  # This isolated smoke consumes only the checkout, so it need not wait for tests.
  install-smoke-check:
    name: CLI install surface execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke built CLI in an isolated workspace
        run: node scripts/ci/smoke-built-cli.mjs

  # Preserve the existing required-check name and fail closed on every dependency.
  install-smoke:
    name: CLI install surface smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-ubuntu, quality-macos, quality-windows, install-smoke-check]
    if: always()
    env:
      QUALITY_UBUNTU_RESULT: ${{ needs.quality-ubuntu.result }}
      QUALITY_MACOS_RESULT: ${{ needs.quality-macos.result }}
      QUALITY_WINDOWS_RESULT: ${{ needs.quality-windows.result }}
      INSTALL_SMOKE_RESULT: ${{ needs.install-smoke-check.result }}
    steps:
      - name: Require quality and install smoke success
        shell: bash
        run: |
          for result in "$QUALITY_UBUNTU_RESULT" "$QUALITY_MACOS_RESULT" "$QUALITY_WINDOWS_RESULT" "$INSTALL_SMOKE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI job finished as: $result"
              exit 1
            fi
          done
