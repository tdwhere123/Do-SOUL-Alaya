name: Release

# Do-SOUL Alaya is distributed via GitHub Releases (source tarball
# + SHA256SUMS), not npm. The end-user installer scripts/install.sh
# downloads these two assets, verifies the checksum, then runs pnpm
# install + pnpm build inside the user's $ALAYA_HOME.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package, smoke, and optionally publish'
        required: true
        type: string
      publish:
        description: 'Create the GitHub Release after all gates pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.3.4'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Peel tag to commit SHA
        id: identity
        env:
          TRIGGER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "FATAL: invalid release tag: ${TAG}"
            exit 1
          fi
          COMMIT_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: expected 40-hex commit SHA, got ${COMMIT_SHA}"
            exit 1
          fi
          if [[ "$COMMIT_SHA" != "$TRIGGER_SHA" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "FATAL: github.sha ${TRIGGER_SHA} != peeled refs/tags/${TAG}^{commit} ${COMMIT_SHA}; dispatch with --ref refs/tags/${TAG} so OIDC provenance, tested commit, tarball, and release tag are identical"
            else
              echo "FATAL: peeled tag commit ${COMMIT_SHA} != github.sha ${TRIGGER_SHA} (tag moved between trigger and resolve)"
            fi
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "commit_sha=${COMMIT_SHA}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Build, test, hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep for hygiene guards
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate release versions
        run: pnpm run release:check-version -- "$RELEASE_TAG"

      - name: Moderate severity dependency audit
        run: |
          for attempt in 1 2 3; do
            pnpm run ci:audit && exit 0
            sleep 20
          done
          exit 1

      # Bench adapters consume daemon dist, including on a clean checkout.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Test
        run: pnpm test

      - name: Hygiene
        run: pnpm run hygiene:unused

      - name: Guard test as-any
        run: |
          pnpm run ci:test-as-any -- --self-test
          pnpm run ci:test-as-any

      - name: Guard storage row casts
        run: pnpm run hygiene:storage-row-casts

      - name: Guard production throw new Error
        run: |
          pnpm run ci:throw-new-error -- --self-test
          pnpm run ci:throw-new-error

      - name: Guard production as-unknown-as
        run: |
          pnpm run ci:production-unknown-as -- --self-test
          pnpm run ci:production-unknown-as

      - name: Guard env docs
        run: pnpm run ci:env-docs

      - name: Guard changelog version
        run: pnpm run ci:changelog-version

      - name: Guard process.env call sites
        run: pnpm run hygiene:process-env

      - name: Guard doc links
        run: pnpm run ci:doc-links

      - name: Guard unused package exports
        run: pnpm run hygiene:unused-exports

      - name: Installer script checks
        run: pnpm run ci:install-scripts

      - name: Guard repository structure
        run: pnpm run ci:repository-structure

      - name: Guard inspector dependency isolation
        run: pnpm run hygiene:inspector-deps

  windows-quality:
    name: Windows build + test + CLI preflight
    runs-on: windows-latest
    timeout-minutes: 30
    needs: resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep the same dist-before-typecheck dependency order as Linux.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Test
        run: pnpm test

      - name: CLI preflight smoke
        run: node scripts/ci/smoke-built-cli.mjs --preflight-only

  content-contracts:
    name: Bench content contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check bench-history contract
        run: |
          node --test scripts/ci/check-content-contracts.test.mjs
          node --test scripts/ci/check-benchmark-storage.test.mjs
          node --test scripts/replay-enrichment-admission.test.mjs
          node scripts/ci/check-content-contracts.mjs

  bench-runner-help:
    name: Bench-runner public surface smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke bench-runner --help advertises LongMemEval-S and LoCoMo
        run: |
          set -euo pipefail
          HELP="$(node apps/bench-runner/bin/alaya-bench-runner.mjs --help)"
          printf '%s\n' "$HELP" | grep -qF longmemeval \
            || { echo "FATAL: --help omitted longmemeval"; exit 1; }
          printf '%s\n' "$HELP" | grep -qF locomo \
            || { echo "FATAL: --help omitted locomo"; exit 1; }

  package:
    name: Package release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - quality
      - windows-quality
      - content-contracts
      - bench-runner-help
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.pack.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      commit_sha: ${{ steps.pack.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release versions
        run: pnpm run release:check-version -- "$RELEASE_TAG"

      - name: Build
        run: pnpm build

      - name: Pack source tarball + SHA256SUMS
        id: pack
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          PREFIX="do-soul-alaya-${VERSION}"
          TARBALL="${PREFIX}.tar.gz"
          EXPECTED="${{ needs.resolve.outputs.commit_sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$EXPECTED" ]]; then
            echo "FATAL: HEAD ${HEAD_SHA} does not match resolved commit ${EXPECTED}"
            exit 1
          fi

          # git archive HEAD captures exactly what the checked-out tag points to.
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "${TARBALL}" HEAD

          tar -tzf "${TARBALL}" > tarball-listing.txt
          grep -qF "${PREFIX}/bin/alaya.mjs" tarball-listing.txt \
            || { echo "FATAL: tarball missing bin/alaya.mjs"; exit 1; }
          grep -qF "${PREFIX}/package.json" tarball-listing.txt \
            || { echo "FATAL: tarball missing package.json"; exit 1; }
          grep -qF "${PREFIX}/scripts/install.sh" tarball-listing.txt \
            || { echo "FATAL: tarball missing scripts/install.sh"; exit 1; }
          tar_size=$(stat -c%s "${TARBALL}")
          [ "$tar_size" -gt 1024 ] \
            || { echo "FATAL: tarball is suspiciously small (${tar_size} bytes)"; exit 1; }

          sha256sum "${TARBALL}" > SHA256SUMS
          cat SHA256SUMS

          {
            echo "tag=${TAG}"
            echo "tarball=${TARBALL}"
            echo "commit_sha=${HEAD_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            ${{ steps.pack.outputs.tarball }}
            SHA256SUMS
            tarball-listing.txt
          retention-days: 14

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            SHA256SUMS

  install-smoke:
    name: Installer smoke from packaged assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets

      - name: Smoke test installer against packaged assets
        run: |
          set -euo pipefail
          TARBALL="${GITHUB_WORKSPACE}/release-assets/${{ needs.package.outputs.tarball }}"
          SUMS="${GITHUB_WORKSPACE}/release-assets/SHA256SUMS"
          SMOKE_HOME="${RUNNER_TEMP}/alaya-smoke-home"
          SMOKE_BIN="${RUNNER_TEMP}/alaya-smoke-bin"
          rm -rf "$SMOKE_HOME" "$SMOKE_BIN" "${SMOKE_HOME}.bak" "${SMOKE_HOME}".staging-*
          mkdir -p "$SMOKE_BIN"

          ALAYA_VERSION="${{ needs.package.outputs.tag }}" \
          ALAYA_LOCAL_TARBALL="$TARBALL" \
          ALAYA_LOCAL_SHA256SUMS="$SUMS" \
          ALAYA_HOME="$SMOKE_HOME" \
          ALAYA_BIN_DIR="$SMOKE_BIN" \
            bash scripts/install.sh

          node scripts/ci/smoke-built-cli.mjs --root "$SMOKE_HOME"
          "$SMOKE_BIN/alaya" --help > install-smoke.txt
          echo "SMOKE OK: tarball + install.sh + smoke-built-cli contract upholds end-to-end." >> install-smoke.txt

      - name: Upload install smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-smoke
          path: install-smoke.txt
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - package
      - install-smoke
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          TARBALL: ${{ needs.package.outputs.tarball }}
          COMMIT_SHA: ${{ needs.package.outputs.commit_sha }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          remote_out="$(git ls-remote --exit-code "https://github.com/${GH_REPO}.git" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          peeled=""
          direct=""
          while read -r sha ref; do
            case "$ref" in
              "refs/tags/${TAG}^{}") peeled="$sha" ;;
              "refs/tags/${TAG}") direct="$sha" ;;
            esac
          done <<< "$remote_out"
          remote_sha="${peeled:-$direct}"
          if [[ "$remote_sha" != "$COMMIT_SHA" ]]; then
            echo "FATAL: remote tag ${TAG} points to ${remote_sha:-missing}, expected ${COMMIT_SHA}"
            exit 1
          fi
          gh release create "$TAG" \
            --verify-tag \
            --target "$COMMIT_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${prerelease_args[@]}" \
            "release-assets/$TARBALL" \
            release-assets/SHA256SUMS
